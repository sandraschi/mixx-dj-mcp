[build-system]
requires = ["setuptools>=42.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mixx-dj-mcp"
version = "0.2.0"
description = "FastMCP server for Mixxx DJ software control via OSC protocol"
readme = "README.md"
authors = [
    {name = "Sandra Schilling (sandraschi)", email = "sandraschipal@gmail.com"},
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Mixers",
]

dependencies = [
    "fastmcp>=3.4.4,<4",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "httpx>=0.27.0",
    "python-osc>=1.8.0",
    "prefab-ui>=0.14.0",
    "rich>=13.0.0",
    "psutil>=5.9.0",
    "demucs>=4.1.0",
    "transformers>=4.40.0",
    "scipy>=1.17.1",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "numpy>=1.26.0",
]

[project.urls]
Homepage = "https://github.com/sandraschi/mixx-dj-mcp"
Documentation = "https://github.com/sandraschi/mixx-dj-mcp#readme"
Issues = "https://github.com/sandraschi/mixx-dj-mcp/issues"
Source = "https://github.com/sandraschi/mixx-dj-mcp"

[project.scripts]
mixx-dj-mcp = "mixx_dj_mcp.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.16.0,<0.17"
]
vinyl = [
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mixx_dj_mcp.skinmaker" = ["schemes/*.json"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "RUF"]
ignore = ["S101", "B008", "S106", "S110", "S112", "S101", "B008", "S106", "S110", "S112", "RUF012", "S603", "S607", "S324", "E402"]

[tool.ruff.lint.per-file-ignores]
"src/mixx_dj_mcp/bridge/osc_bridge.py" = ["RUF059"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.6.1",
    "pyinstaller>=6.21.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]
